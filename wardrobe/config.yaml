name: Wardrobe
version: "0.3.0"
slug: wardrobe
description: >-
  A shared wardrobe for your household: garments with photos, outfit
  suggestions, fit checks, care and laundry, and what to buy next.
url: https://github.com/lehausmanow-max/ha-wardrobe
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:hanger
panel_title: Wardrobe
# Visible to non-admin users too, so the whole household can use it.
panel_admin: false
# Reads a weather entity to dress for the temperature.
homeassistant_api: true
backup: hot
# Restart the app when it stops accepting connections. TCP, because the app answers HTTP only to Ingress.
watchdog: tcp://[HOST]:[PORT:8099]
options:
  ai_text_provider: none
  ai_vision_provider: none
  ollama_url: "http://homeassistant.local:11434"
  ollama_text_model: "qwen2.5:7b"
  ollama_vision_model: "qwen2.5vl:7b"
  claude_model: "claude-sonnet-5-5"
  log_level: info
schema:
  ai_text_provider: list(none|ollama|claude)
  ai_vision_provider: list(none|ollama|claude)
  ollama_url: url
  ollama_text_model: str
  ollama_vision_model: str
  claude_api_key: password?
  claude_model: str
  weather_entity: str?
  log_level: list(debug|info|warning|error)
