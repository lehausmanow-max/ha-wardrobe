<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8eaed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171b" media="(prefers-color-scheme: dark)">
<title>Wardrobe</title>
<link rel="stylesheet" href="static/app.css?v={{v}}">
</head>
<body>
<header class="topbar">
  <div class="profiles" id="profiles" role="tablist" aria-label="Whose wardrobe"></div>
  <button class="icon-btn" data-action="settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.4 7.4 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6Z"/></svg>
  </button>
</header>

<main id="main" tabindex="-1"></main>

<button class="fab" id="fab" data-action="add" aria-label="Add a garment">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
  <span>Add</span>
</button>
<input type="file" id="intake-file" accept="image/*" hidden>
<input type="file" id="photo-file" accept="image/*" hidden>

<nav class="tabs" aria-label="Sections">
  <a href="#/wardrobe" data-tab="wardrobe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a2 2 0 1 1 2 2c-1 .3-2 1-2 2l9 7.5c.6.6.2 1.5-.6 1.5H3.6c-.8 0-1.2-.9-.6-1.5L12 9"/></svg>Wardrobe</a>
  <a href="#/looks" data-tab="looks"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="8" height="7" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="3" y="13" width="8" height="7" rx="1"/><rect x="13" y="13" width="8" height="7" rx="1"/></svg>Looks</a>
  <a href="#/fit" data-tab="fit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15 15 3l6 6L9 21Z"/><path d="m7 11 2 2m1-5 2 2m1-5 2 2"/></svg>Fit</a>
  <a href="#/care" data-tab="care"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M4 7l2 13h12l2-13"/></svg>Care</a>
  <a href="#/shop" data-tab="shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Shop</a>
</nav>

<div class="sheet-backdrop" id="backdrop" hidden></div>
<div id="sheets"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="static/app.js?v={{v}}"></script>
</body>
</html>
