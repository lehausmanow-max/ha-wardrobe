name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Same minor version as python3 in the base image (Alpine 3.24 ships 3.14).
  # The build job fails if the image drifts from this.
  PYTHON_VERSION: "3.14"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r wardrobe/app/requirements.txt -r tests/requirements.txt
      - name: Run pytest
        run: python -m pytest -v

  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Read app version
        id: meta
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' wardrobe/config.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build amd64 and arm64
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg BUILD_VERSION=${{ steps.meta.outputs.version }} \
            wardrobe/

      - name: Load amd64 image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BUILD_VERSION=${{ steps.meta.outputs.version }} \
            --load -t wardrobe:ci \
            wardrobe/

      - name: Python in image matches the test job
        run: |
          image_py="$(docker run --rm --entrypoint python3 wardrobe:ci -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          echo "image python: $image_py, tests: $PYTHON_VERSION"
          test "$image_py" = "$PYTHON_VERSION"

      - name: Smoke test
        run: |
          # run.sh needs the Supervisor, so start uvicorn directly.
          docker run -d --name wardrobe -p 8099:8099 -w /app \
            -e WARDROBE_DATA_DIR=/tmp/data \
            -e WARDROBE_VERSION=${{ steps.meta.outputs.version }} \
            --entrypoint /opt/venv/bin/python \
            wardrobe:ci -m uvicorn wardrobe.main:app --host 0.0.0.0 --port 8099
          for i in $(seq 1 30); do
            if curl -fsS localhost:8099/api/meta -o meta.json; then break; fi
            sleep 1
          done
          curl -fsS localhost:8099/api/meta -o meta.json
          python3 -c 'import json, sys; v = json.load(open("meta.json"))["version"]; print("version:", v); sys.exit(v != sys.argv[1])' \
            "${{ steps.meta.outputs.version }}"

      - name: Container log
        if: failure()
        run: docker logs wardrobe || true
